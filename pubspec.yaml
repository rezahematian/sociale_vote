name: sociale_vote
description: Civic social voting platform
publish_to: "none"

version: 1.0.0+3

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  fl_chart: ^0.66.0
  uuid: ^4.0.0

  # =========================
  # MAPPA REALE (CROSS-PLATFORM)
  # =========================
  flutter_map: ^7.0.2
  flutter_map_cancellable_tile_provider: ^3.0.2
  latlong2: ^0.9.1

  # =========================
  # WORLD GLOBE 3D
  # =========================
  flutter_earth_globe:
    path: third_party/flutter_earth_globe_social_vote

  # =========================
  # GEOLOCATION / GEOCODING
  # =========================
  geolocator: ^13.0.4
  geocoding: ^4.0.0

  # =========================
  # STATE MANAGEMENT
  # =========================
  provider: ^6.1.2

  # =========================
  # UI / MATERIAL
  # =========================
  cupertino_icons: ^1.0.6

  # =========================
  # HTTP
  # =========================
  http: ^1.2.1

  # =========================
  # LOCAL STORAGE
  # =========================
  shared_preferences: ^2.2.2

  # =========================
  # DATE / TIME
  # =========================
  intl: ^0.20.2

  # =========================
  # URL LAUNCHER (APRIRE FONTE)
  # =========================
  url_launcher: ^6.3.0

  # =========================
  # IMAGE PICKER (AVATAR UPLOAD)
  # =========================
  image_picker: ^1.1.2

  # =========================
  # LOCAL BIOMETRIC UNLOCK
  # =========================
  local_auth: ^3.0.2

  # =========================
  # SHARE
  # =========================
  share_plus: ^7.2.2

  # =========================
  # LOCAL QR (SESSIONS / VERIFIED RESULT)
  # =========================
  qr_flutter: ^4.1.0

  # =========================
  # SUPABASE
  # =========================
  supabase_flutter: ^2.8.0

  # =========================
  # FIREBASE / ANALYTICS
  # =========================
  firebase_core: ^4.6.0
  firebase_analytics: ^12.2.0

  meta: any

  # =========================
  # WEB DOM / JS INTEROP
  # =========================
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/globe/earth_day_nasa_blue_marble_2048.png
    - assets/globe/earth_day_nasa_bmng_august_4096.jpg
    - assets/globe/earth_night_nasa_black_marble_2016_3600.jpg
    - assets/globe/gaia_edr3_sky_equirectangular_2160.png
  shaders:
    - shaders/scientific_sky.frag

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
