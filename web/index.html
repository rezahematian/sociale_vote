<!DOCTYPE html>
<html>
<head>

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="Social Vote is a civic platform for polls, news, discussions and geographically relevant social content."

  <meta name="theme-color" content="#FFFFFF">

  <!-- Social preview baseline. Dynamic Poll/Post metadata remains a later server-side step. -->

  <meta property="og:site_name" content="Social Vote">
  <meta property="og:title" content="Social Vote">
  <meta property="og:description" content="Polls, news and civic discussions from World to Country to City.">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Social Vote">
  <meta name="twitter:description" content="Polls, news and civic discussions from World to Country to City.">
  <meta name="twitter:image" content="https://socialevote.com/social-vote-og.png">

  <!-- Mobile and iOS web app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Social Vote">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>Social Vote</title>
  <link rel="manifest" href="manifest.json">

    Social Vote Web Globe
    - Three.js is pinned to one exact release.
    - WebGL renderer is isolated from the native Flutter globe package.

      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="social_vote_globe.js?v=WEB-G3H-20260815-ROTATION-CACHE1"></script>

  <script src="flutter_bootstrap.js" async></script>
