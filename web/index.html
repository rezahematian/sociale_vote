<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="Social Vote is a civic platform for polls, news, discussions and geographically relevant social content."
  >
  <meta name="theme-color" content="#FFFFFF">

  <!--
    Flutter Hosting serves one SPA shell for several routes. Google supports a
    JavaScript-created canonical when the original HTML does not declare a
    conflicting canonical. Dynamic Post/Poll metadata injected at the edge is
    preserved because an existing canonical is never replaced here.
  -->
  <script id="social-vote-seo">
    (() => {
      const rawPath = window.location.pathname || '/';
      const path = rawPath.length > 1 ? rawPath.replace(/\/+$/, '') : '/';
      const publicExactPaths = new Set([
        '/',
        '/polls',
        '/news',
        '/social',
        '/map',
        '/terms',
        '/privacy',
        '/how-it-works'
      ]);
      const publicPathPatterns = [
        /^\/poll\/[^/]+$/,
        /^\/post\/[^/]+$/,
        /^\/city\/[a-zA-Z]{2}\/[^/]+$/
      ];
      const isIndexable = publicExactPaths.has(path) ||
        publicPathPatterns.some((pattern) => pattern.test(path));

      let robots = document.querySelector('meta[name="robots"]');
      if (!robots) {
        robots = document.createElement('meta');
        robots.name = 'robots';
        document.head.appendChild(robots);
      }
      robots.content = isIndexable
        ? 'index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1'
        : 'noindex,nofollow';

      if (isIndexable && !document.querySelector('link[rel="canonical"]')) {
        const canonical = document.createElement('link');
        canonical.rel = 'canonical';
        canonical.href = `https://socialevote.com${path}`;
        document.head.appendChild(canonical);
      }
    })();
  </script>

  <!-- Social preview baseline. Dynamic Poll/Post metadata remains server/edge-owned. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Social Vote">
  <meta property="og:title" content="Social Vote">
  <meta property="og:description" content="Polls, news and civic discussions from World to Country to City.">
  <meta property="og:url" content="https://socialevote.com/">
  <meta property="og:image" content="https://socialevote.com/social-vote-og.png">
  <meta property="og:image:alt" content="Social Vote">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Social Vote">
  <meta name="twitter:description" content="Polls, news and civic discussions from World to Country to City.">
  <meta name="twitter:image" content="https://socialevote.com/social-vote-og.png">

  <!-- Mobile and iOS web app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Social Vote">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Social Vote favicon (square and larger than Google's 48px recommendation). -->
  <link rel="icon" type="image/png" sizes="96x96" href="favicon.png">

  <title>Social Vote</title>
  <link rel="manifest" href="manifest.json">
</head>

  <script type="importmap">

      "imports": {
        "three": "./assets/web/vendor/three/three.module.js",
        "three/addons/": "./assets/web/vendor/three/addons/"
      }
    }
  </script>
  <script type="module" src="social_vote_globe.js?v=WEB-WORLD-V10-6-VOCE-GLYPH-FAILSOFT"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
